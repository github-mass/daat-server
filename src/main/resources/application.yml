
vac-atlas:
  version: eAIP_23_MAR_2023
  base-url: https://www.sia.aviation-civile.gouv.fr/dvd/${vac-atlas.version}/Atlas-VAC
  airport-list-js-url: ${vac-atlas.base-url}/Javascript/AeroArraysVac.js
  heliport-list-js-url: ${vac-atlas.base-url}/Javascript/AeroArraysVach.js
  airport-card-url-template: ${vac-atlas.base-url}/PDF_AIPparSSection/VAC/AD/AD-2.{code}.pdf
  heliport-card-url-template: ${vac-atlas.base-url}/PDF_AIPparSSection/VACH/AD/AD-3.{code}.pdf

  pdf-extraction:
    executor:
      core-pool-size: 6
      max-pool-size: 6
      thread-name-prefix: pdf-conversion
    timeout: 2m
    cleanup: false
    ocr-dpi: 480

