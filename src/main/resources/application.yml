aixm:
  import:
    sources:
#      - uri: "file:data/aixm/export_xml_bd_sia_2023-05-18-a3"
#        description: "SIA dataset from 2023-05-18"
#      - uri: "file:data/aixm/export_xml_bd_sia_2023-06-15-x1"
#        description: "SIA dataset from 2023-06-15"
      - uri: "file:data/aixm/export_xml_bd_sia_2023-07-13-b5"
        description: "SIA dataset from 2023-07-13"
    parse-sia-export: true

  update:
    enabled: true
    initial-delay: 0
    fixed-delay: 60


zicad:
  import:
    sources:
      - uri: "https://www.geoportail.gouv.fr/depot/layers/ORTHOIMAGERY.ORTHOPHOS.RESTRICTEDAREAS/kml/Arrete_ZICAD_01-2023.kml"
        description: "ZICAD dataset from 2023-03-02"

  update:
    enabled: true
    initial-delay: 0
    fixed-delay: 60

altitude-service:
  type: "ign"
  ign:
    rest-service-url: 'https://data.geopf.fr/altimetrie/calcul/alti/rest/elevation.json'
    data-resource-id: 'ign_rge_alti_wld'

spring:
  cloud:
    refresh:
      enabled: true

cache:
  rate-limit-buckets:
    enabled: true
    maximum-size: 10000

  altitude:
    enabled: true
    maximum-size: 10000
    expire-after-access: "10m"

  proximity-info:
    enabled: true
    maximum-size: 500
    expire-after-access: "10m"

logging:
  level:
    com.mass: DEBUG

server:
  port: 8077
  servlet:
    application-display-name: 'DAAT API'
    context-path: "/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "health, beans, mappings"
  endpoint:
    metrics:
      access: read_only
    health:
      access: read_only
    caches:
      access: read_only
    beans:
      access: read_only
    mappings:
      access: read_only

bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-buckets
      url: .*/api.*/proximity.*
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 12
              time: 1
              unit: minutes
      metrics:
        enabled: true
        types: REJECTED_COUNTER

  default-metric-tags:
    - key: IP
      expression: getRemoteAddr()
      types: REJECTED_COUNTER
