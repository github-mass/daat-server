<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" style="font-size: 12pt">
<!--  <g transform="translate(0, -100) rotate(20) scale(.75)">-->
  <g>
    <circle cx="200" cy="25" r="5" />
    <text x="180" y="15" style="font-family: sans-serif">YOU</text>
    <line x1="20" y1="210" x2="220" y2="210" style="stroke:#332d2d;stroke-width:2;" stroke-dasharray="5"/>
    <rect x="30" y="200" width="80" height="20" style="fill:grey;" />
    <text x="35" y="215" fill="#f0f0f0" style="font-family: sans-serif">RUNWAY</text>

    <line x1="200" y1="25" x2="200" y2="210" style="stroke: #1a0b0b;stroke-width: 2" />
    <polyline points="190 210 190 200 200 200" style="fill:none; stroke: #1a0b0b;stroke-width: 2" />

    <text x="220" y="140" transform="rotate(270 220, 140)" style="font-family: sans-serif;" fill="darkred">DtA</text>
    <text x="130" y="230" style="font-family: sans-serif;" fill="darkred">DoA</text>
  </g>
  <g>
    <text x="20" y="70" style="font-family: sans-serif; font-size: 11pt">
      <tspan>DtA = Distance To Axis</tspan>
      <tspan x="20" y="90">DoA = Distance On Axis</tspan>
    </text>
  </g>
</svg>
